name: Validate Template

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Template
        run: |
          dotnet new install ./templates/ResoniteMod/

      - name: Test rmlmod Template
        run: |
          dotnet new rmlmod -n TestModName -A TestModAuthor --dry-run